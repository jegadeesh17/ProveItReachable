# ---- likely reachable ------------------------------------------------------------------------

[[case]]
id = "yaml-direct-call"
repo = "yaml-direct"
package = "pyyaml"
advisory = "GHSA-8q59-q68h-6hv4"
label = "likely reachable"
rationale = "load_config calls yaml.full_load directly and the __main__ block reaches it."

[[case]]
id = "yaml-import-as-alias"
repo = "yaml-import-as"
package = "pyyaml"
advisory = "GHSA-8q59-q68h-6hv4"
label = "likely reachable"
rationale = "import yaml as y; y.full_load(text) is the vulnerable call under an alias."

[[case]]
id = "yaml-from-import-as-alias"
repo = "yaml-from-import-as"
package = "pyyaml"
advisory = "GHSA-8q59-q68h-6hv4"
label = "likely reachable"
rationale = "from yaml import full_load as parse_settings; load_config calls parse_settings."

[[case]]
id = "yaml-call-chain-cli"
repo = "yaml-call-chain"
package = "pyyaml"
advisory = "GHSA-8q59-q68h-6hv4"
label = "likely reachable"
rationale = "cli.main -> service.read_settings -> parser.parse_document -> yaml.full_load."

[[case]]
id = "requests-session-verify-false"
repo = "requests-mixed"
package = "requests"
advisory = "GHSA-9wx4-h78v-vm56"
label = "likely reachable"
rationale = "fetch builds a requests.Session and makes its first request with verify=False."

[[case]]
id = "pyrl-yaml-load-default-loader-14343"
repo = "pyrl"
package = "pyyaml"
advisory = "GHSA-8q59-q68h-6hv4"
label = "likely reachable"
rationale = "main.py calls yaml.load(f) without a Loader; PyYAML 5.3 then uses FullLoader."

[[case]]
id = "pyrl-yaml-load-default-loader-1747"
repo = "pyrl"
package = "pyyaml"
advisory = "GHSA-6757-jp84-gxfx"
label = "likely reachable"
rationale = "Same yaml.load(f) call in main.py; FullLoader in PyYAML 5.3 is the vulnerable loader."

